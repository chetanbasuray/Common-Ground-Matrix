name: Indicator Discovery

on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Run discovery script
        run: node scripts/discover-indicators.mjs

      - name: Upload indicator catalog artifact
        uses: actions/upload-artifact@v4
        with:
          name: indicator-discovery
          path: generated/indicator-discovery.json
